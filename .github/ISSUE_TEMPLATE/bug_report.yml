name: Bug report
description: Report a reproducible problem with the software
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for reporting a problem. Remove credentials, personal data, and
        proprietary dataset content before submitting.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the command, minimal code or configuration, and complete error.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.1 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, accelerator, and PyTorch version.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
